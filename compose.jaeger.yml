# Docker Compose service definition fragment for Jaeger (all-in-one) receiver (T28).
# T29 will fold this into the root compose.yaml alongside postgres, kafka, and app.
services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
      - "16686:16686"   # Jaeger UI and Query REST API
    restart: unless-stopped

# adaptive-agent-runtime — docker-compose demo stack (T29).
#
# Folds in the jaeger fragment (compose.jaeger.yml, T28 — deleted by this change)
# alongside postgres, kafka and the app itself. The `ollama` service is OFF by
# default: start it explicitly for local-model runs with
#   docker compose --profile ollama up -d
#
# Copy .env.example to .env and fill the required keys before `docker compose up`
# (scripts/smoke.sh fails fast when they are missing).
name: adaptive-agent-runtime

services:
  app:
    build:
      context: .
    image: adaptive-agent-runtime:0.1.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        # Tracing export is non-fatal by design (T28 ExporterDownNonFatalTest),
        # and the all-in-one image ships no shell/probe binary for a healthcheck.
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-adaptive}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-adaptive}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # X-API-Key for the REST/SSE ingress (auth only — docs/ENVELOPE.md).
      RUNTIME_API_KEY: ${RUNTIME_API_KEY:?RUNTIME_API_KEY must be set in .env}
      # Kafka ingress opt-in (KafkaIngressConfig) wired to the kafka service.
      RUNTIME_KAFKA_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Hermetic default: the fixture-model profile registers a deterministic
      # FixedTextChatModel (no LLM, no network). Unset for real-model runs.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-fixture-model}
      SPRING_AI_OPENAI_API_KEY: ${SPRING_AI_OPENAI_API_KEY:-}
      SPRING_AI_OPENAI_BASE_URL: ${SPRING_AI_OPENAI_BASE_URL:-}
      # Optional per-leg override of the LLM classifier model; blank = the global
      # spring.ai.openai.chat.options.model (the model every topology node uses).
      RUNTIME_CLASSIFIER_MODEL: ${RUNTIME_CLASSIFIER_MODEL:-}
      # Classifier leg selection (llm default; jev routes the AMBIGUOUS band through
      # the TypeSafe AI decision model) and that leg's API key passthrough.
      RUNTIME_CLASSIFIER_LEG: ${RUNTIME_CLASSIFIER_LEG:-}
      RUNTIME_CLASSIFIER_JEV_API_KEY: ${RUNTIME_CLASSIFIER_JEV_API_KEY:-}
      # Optional skills folder (runtime.skills.path): uncomment together with the
      # ./skills volume mount below — blank would scan nothing, absent stays off.
      # RUNTIME_SKILLS_PATH: /app/skills
      # Micrometer OTLP export → jaeger (application.yml reads this env). The
      # signal-specific var pins the full path verbatim: the generic base var is
      # all the OTel SDK honors when Boot's property layer is bypassed, and it
      # would append /v1/traces onto an already-full path (→ 404).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
    # Skills folder mount — uncomment together with RUNTIME_SKILLS_PATH above.
    # volumes:
    #   - ./skills:/app/skills:ro
    ports:
      - "8080:8080"
    healthcheck:
      # bash /dev/tcp HTTP probe: /actuator/health returns 200 once Boot is up.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; grep -q ' 200 ' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adaptive}
      POSTGRES_USER: ${POSTGRES_USER:-adaptive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  kafka:
    # KRaft single-node: one node holds both broker and controller roles.
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  jaeger:
    # Folded from compose.jaeger.yml (T28 fragment — deleted).
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
      - "16686:16686"   # Jaeger UI and Query REST API

  ollama:
    # Local-model service, OFF by default (compose profile). For real-model runs
    # without a cloud key: docker compose --profile ollama up -d ollama, then in
    # .env set SPRING_PROFILES_ACTIVE=, SPRING_AI_OPENAI_BASE_URL=http://ollama:11434
    # and any non-empty SPRING_AI_OPENAI_API_KEY, and pull a model once via
    # docker compose exec ollama ollama pull <model-tag>.
    profiles: ["ollama"]
    image: ollama/ollama:0.12.9
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  pgdata:
  ollama:

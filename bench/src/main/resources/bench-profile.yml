# Benchmark configuration: a single model branch (the agent-facing endpoint the
# runtime benchmarks) and a full judge branch. No profiles — swap values here.
#
# NOTE (model naming): `model` must be a model NAME, never a server-side file
# path. The self-hosted llama-server at 192.168.1.54:8080 serves its gguf by
# path unless started with --alias; probe on 2026-10-19 showed it currently
# exposes /mnt/models/Qwen3.6-35B-A3B-UD-IQ4_XS.gguf. Start it with
# `--alias qwen3.6-35b-a3b` so the name below resolves.
#
# NOTE (pricing): self-hosted endpoint — 0.00 = no per-token cost; cost columns
# reflect tokens only. History: T27 first pinned the vertex proxy
# (gemini-3.8-flash-vertex -> gemini-3-flash after 403s), then the proxy was
# declared permanently unavailable and the run moved to llama-server.

model:
  provider: openai-compatible
  base-url: http://192.168.1.54:8080
  model: qwen3.6-35b-a3b
  api-key-env: RUNTIME_BENCH_API_KEY
  temperature: 0.0
  seed: 42
  runs: 3
  pricing:
    input-per-1m: 0.00
    output-per-1m: 0.00

judge:
  base-url: http://192.168.1.54:8080
  model: qwen3.6-35b-a3b
  api-key-env: RUNTIME_BENCH_API_KEY
  temperature: 0.0
  seed: 42
  rubric:
    scale: 0-5
    description: "Evaluates completeness, factual correctness against reference sources, and reasoning structure."
